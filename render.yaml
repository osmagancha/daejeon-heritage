# Render 배포 설정 (Blueprint)
# 저장소를 연결하면 이 파일대로 서비스가 만들어집니다.
services:
  - type: web
    name: hanbat-giheng
    runtime: node
    plan: free
    region: singapore          # 한국에서 가장 가까운 무료 지역
    buildCommand: npm install --omit=dev
    startCommand: node server/index.js
    healthCheckPath: /api/notices
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: "22"
      # 구글 로그인을 쓰려면 Render 대시보드에서 값을 넣으세요.
      # (클라이언트 ID 는 공개되는 값이지만 저장소에는 두지 않습니다)
      - key: GOOGLE_CLIENT_ID
        sync: false
      # 데이터를 계속 남기려면 PostgreSQL 접속 문자열을 넣으세요.
      # (비어 있으면 임시 파일에 저장되어 재배포 시 사라집니다)
      - key: DATABASE_URL
        sync: false
